<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="utf-8">
    <title>Leo Robot Controller</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { text-align: center; font-family: 'Segoe UI', sans-serif; background: #f4f4f9; padding: 20px; }
        .disabled { opacity: 0.3; pointer-events: none; filter: grayscale(1); }
        .hint { background: #fff3cd; color: #856404; padding: 12px; border-radius: 10px; margin-bottom: 20px; border: 1px solid #ffeeba; font-size: 14px; }
        
        #log { height: 150px; overflow-y: scroll; background: #222; color: #0f0; padding: 10px; font-family: monospace; font-size: 12px; text-align: left; border-radius: 8px; margin: 20px auto; width: 80%; max-width: 400px; }
        
        .controls { 
            display: grid; 
            grid-template-columns: repeat(3, 80px); 
            grid-template-rows: repeat(3, 80px); 
            gap: 10px; 
            justify-content: center; 
            margin: 20px auto; 
        }
        .controls button { 
            width: 80px; height: 80px; border-radius: 15px; border: none; background: #007bff; 
            color: white; font-size: 24px; cursor: pointer; box-shadow: 0 4px 6px rgba(0,0,0,0.2); 
        }
        .controls button:active { background: #0056b3; }
        .btn-up { grid-column: 2; grid-row: 1; }
        .btn-left { grid-column: 1; grid-row: 2; }
        .btn-stop { grid-column: 2; grid-row: 2; background: #dc3545 !important; }
        .btn-right { grid-column: 3; grid-row: 2; }
        .btn-down { grid-column: 2; grid-row: 3; }
        
        .speed-control { margin: 20px auto; width: 200px; }
        .link { margin-top: 20px; display: block; color: #007bff; font-weight: bold; }
    </style>
</head>
<body>

    <div id="hintBox" class="hint">
        <b>Підключення:</b> З'єднайте HC-05 (пароль: 1234), натисніть кнопку нижче.
    </div>

    <button id="connectBtn" onclick="connectSerial()" style="padding: 15px 30px; font-size: 16px; border-radius: 10px; border: none; background: #28a745; color: white; cursor: pointer;">Підключити Serial</button>

    <div id="panel" class="disabled">
        <div id="log"><strong>📥 Лог:</strong><br></div>

        <input type="text" id="customInput" placeholder="Команда..." style="padding: 10px; border-radius: 8px; border: 1px solid #ccc; width: 200px;">
        <button onclick="sendCustom()" style="padding: 10px 20px;">Надіслати</button>

        <div class="speed-control">
            <div>Швидкість: <span id="speedVal">5</span></div>
            <input type="range" id="speed" min="0" max="9" value="5" style="width:100%" oninput="updateSpeed(this.value)">
        </div>

        <div class="controls">
            <button class="btn-up" onmousedown="sendCommand('f')" onmouseup="sendCommand('s')" ontouchstart="sendCommand('f')" ontouchend="sendCommand('s')">↑</button>
            <button class="btn-left" onmousedown="sendCommand('l')" onmouseup="sendCommand('s')" ontouchstart="sendCommand('l')" ontouchend="sendCommand('s')">←</button>
            <button class="btn-stop" onclick="sendCommand('s')">■</button>
            <button class="btn-right" onmousedown="sendCommand('r')" onmouseup="sendCommand('s')" ontouchstart="sendCommand('r')" ontouchend="sendCommand('s')">→</button>
            <button class="btn-down" onmousedown="sendCommand('b')" onmouseup="sendCommand('s')" ontouchstart="sendCommand('b')" ontouchend="sendCommand('s')">↓</button>
        </div>

        <a href="https://wokwi.com/projects/466167753546181633" target="_blank" class="link">Тут код для машинки ЛЕО</a>
    </div>

    <script>
        let writer, reader;
        const panel = document.getElementById("panel");
        const logEl = document.getElementById("log");
        const customInput = document.getElementById("customInput");
        const speedVal = document.getElementById("speedVal");

        function log(msg) {
            const time = new Date().toLocaleTimeString();
            logEl.innerHTML += `[${time}] ${msg}<br>`;
            logEl.scrollTop = logEl.scrollHeight;
        }

        async function connectSerial() {
            try {
                const port = await navigator.serial.requestPort();
                await port.open({ baudRate: 9600 });
                writer = port.writable.getWriter();
                reader = port.readable.getReader();
                panel.classList.remove('disabled');
                document.getElementById("hintBox").style.display = "none";
                log("✅ Підключено");
                readLoop();
            } catch (err) { log("❌ Помилка: " + err); }
        }

        async function readLoop() {
            while (true) {
                try {
                    const { value, done } = await reader.read();
                    if (done) break;
                    log("📥 " + new TextDecoder().decode(value).trim());
                } catch (e) { break; }
            }
        }

        function updateSpeed(val) {
            speedVal.innerText = val;
            sendCommand(val); // Авто-відправка швидкості
        }

        async function sendCommand(cmd) {
            if (writer) {
                await writer.write(new TextEncoder().encode(cmd + "\n"));
                log("➡️ " + cmd);
            }
        }

        function sendCustom() {
            if(customInput.value) {
                sendCommand(customInput.value);
                customInput.value = "";
            }
        }

        window.addEventListener('keydown', (e) => {
            if (panel.classList.contains('disabled') || e.repeat) return;
            const keys = { "ArrowUp": 'f', "ArrowDown": 'b', "ArrowLeft": 'l', "ArrowRight": 'r' };
            if (keys[e.key]) sendCommand(keys[e.key]);
        });
        
        window.addEventListener('keyup', (e) => {
            if (panel.classList.contains('disabled')) return;
            const keys = ["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight"];
            if (keys.includes(e.key)) sendCommand('s');
        });
        
        customInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') sendCustom(); });
    </script>
</body>
</html>
